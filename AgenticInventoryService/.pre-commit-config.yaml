# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: name-tests-test
      - id: check-yaml
#      - id: check-json
      - id: check-toml
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: [--line-length=120]
        language_version: python3.12
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: [--max-line-length=120]
  - repo: local
    hooks:
      - id: run-swagger-generation
        name: Run Swagger Generation
        entry: ./run.sh api_gen
        language: script
        files: .*
        stages: [manual]
      - id: run-tests
        name: Run tests
        entry: ./run.sh test
        language: script
        files: .*
        stages: [manual]
      - id: lint-angular
        name: Lint Angular Code
        entry: bash -c 'cd $(git rev-parse --show-toplevel)/agentic_inventory/frontend && npx eslint --max-warnings=0 "src/**/*.ts"'
        language: system
        files: .*frontend/src/.*\.ts$
      - id: format-angular
        name: Format Angular Code
        entry: bash -c 'cd $(git rev-parse --show-toplevel)/agentic_inventory/frontend && npx prettier --write "src/**/*.{ts,html,scss}"'
        language: system
        files: .*frontend/src/.*\.(ts|html|scss)$
      - id: angular-test
        name: Run Angular Tests
        entry: bash -c 'cd $(git rev-parse --show-toplevel)/agentic_inventory/frontend && npm run test -- --watch=false --browsers=ChromeHeadless'
        language: system
        files: .*frontend/src/.*\.ts$
        stages: [manual]
