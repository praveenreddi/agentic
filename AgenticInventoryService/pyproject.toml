[tool.poetry]
name = "agentic_inventory"
version = "1.0.0"
description = "Inventory AI subsystem. Talk to your yield and revenue"
authors = ["Evgeny Bob <evgeny.bob@hgv.com>"]
readme = "README.md"

[[tool.poetry.source]]
name = "fpho"
url = "https://files.pythonhosted.org"
priority = "supplemental"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
gunicorn = "^21.0.0"
# Web stuff
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
starlette = "^0.46.1"
marshmallow = "^3.21.3"
# Azure
azure-common = "^1.1.28"
azure-cosmos = "^4.9.0"
azure-identity = "^1.21.0"
azure-mgmt-cognitiveservices = "^13.6.0"
azure-keyvault-secrets = "^4.9.0"
# Graph dependencies
networkx = "^3.2.1"
# HTTP and API
aiohttp = "^3.11.13"
httpx = "^0.28.1"
httpcore = "^1.0.7"
#Job Scheduler
APScheduler = "3.11.0"
# Utilities
pydantic = "^2.10.6"
pydantic-settings = "^2.8.1"
pydantic-core = "^2.27.2"
python-dotenv = "^1.0.1"
ecs-logging = "^2.2.0"
orjson = "3.10.15"
# Monitoring
opencensus = "^0.11.0"
opencensus-ext-azure = "^1.1.9"
opencensus-ext-logging = "^0.1.0"
# Data processing & visualization
numpy = "^2.2.3"
pandas = "^2.2.3"
matplotlib = "^3.10.1"
plotly = "^6.0.0"
seaborn = "^0.13.2"
pyarrow = "^19.0.1"
# OpenAI
openai = "^1.66.2"
tiktoken = "^0.9.0"
# Crypto and authentication
cryptography = "^44.0.2"
msal = "^1.31.1"
msal-extensions = "^1.2.0"
PyJWT = {extras = ["crypto"], version = "^2.10.1"}
# Google services
google-api-core = "^2.24.2"
google-auth = "^2.38.0"
google-cloud-bigquery = "^3.30.0"
google-cloud-core = "^2.4.3"
# Misc
tqdm = "^4.67.1"
typing-extensions = "^4.12.2"
regex = "^2024.11.6"
requests = "^2.32.3"
certifi = "^2025.1.31"
idna = "^3.10"
urllib3 = "^2.3.0"
websockets = "^14.2"
click = "^8.1.8"
six = "^1.17.0"
sniffio = "^1.3.1"
pyyaml = "^6.0.2"
ddtrace = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pylint = "^3.1.0"
pylint-flask = "^0.6"
mock = "^5.1.0"
pre-commit = "^3.6.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::SyntaxWarning:azure.search.documents.*"
]
norecursedirs = ["stress_test_reports"]
testpaths = ["tests"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
