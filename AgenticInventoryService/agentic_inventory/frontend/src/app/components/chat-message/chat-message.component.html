<div
  #messageContent
  class="message-container"
  [ngClass]="{
    'bot-message-container': message.role === 'bot',
    'user-message-container': message.role === 'user',
  }"
  (mouseenter)="showActions = true"
  (mouseleave)="showActions = false"
>
  <div class="message-avatar">
    <!-- Bot icon -->
    <div *ngIf="message.role === 'bot'" class="avatar bot-avatar">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-bot h-4 w-4"
      >
        <path d="M12 8V4H8"></path>
        <rect width="16" height="12" x="4" y="8" rx="2"></rect>
        <path d="M2 14h2"></path>
        <path d="M20 14h2"></path>
        <path d="M15 13v2"></path>
        <path d="M9 13v2"></path>
      </svg>
    </div>

    <!-- User icon -->
    <div *ngIf="message.role === 'user'" class="avatar user-avatar">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-user h-4 w-4"
      >
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </div>
  </div>

  <div
    class="message-content"
    [ngClass]="{
      'bot-message': message.role === 'bot',
      'user-message': message.role === 'user',
    }"
  >
    <div *ngIf="message.isStreaming" class="typing-indicator">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div *ngIf="!message.isStreaming">{{ message.content }}</div>
  </div>

  <div
    *ngIf="showActions && message.role === 'bot' && !message.isStreaming"
    class="message-actions"
  >
    <button
      class="action-button"
      (click)="onRegenerate()"
      title="Regenerate response"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
        <path d="M3 3v5h5"></path>
      </svg>
    </button>
    <button
      class="action-button"
      (click)="onCopyToClipboard(message.content)"
      title="Copy to clipboard"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
        <path
          d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
        ></path>
      </svg>
    </button>
    <button class="action-button" (click)="onDelete()" title="Delete message">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 6h18"></path>
        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
      </svg>
    </button>
  </div>
</div>
