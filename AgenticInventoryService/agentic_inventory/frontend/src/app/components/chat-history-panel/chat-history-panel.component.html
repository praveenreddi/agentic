<aside
  class="history-panel"
  [class.open]="isOpen"
  [class.collapsed]="isCollapsed"
>
  <div class="panel-header">
    <button class="new-chat-button" (click)="onCreateNewChat()">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-message-square-plus h-5 w-5"
      >
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
        ></path>
        <path d="M12 7v6"></path>
        <path d="M9 10h6"></path>
      </svg>
      <span>New Chat</span>
    </button>
  </div>

  <div class="all-chats-header">
    <div class="all-chats-title">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon icon-layout-grid"
      >
        <rect width="7" height="7" x="3" y="3" rx="1"></rect>
        <rect width="7" height="7" x="14" y="3" rx="1"></rect>
        <rect width="7" height="7" x="14" y="14" rx="1"></rect>
        <rect width="7" height="7" x="3" y="14" rx="1"></rect>
      </svg>
      <span>All Chats</span>
    </div>
  </div>

  <div class="sessions-list" [class.hidden-when-collapsed]="isCollapsed">
    <div
      *ngFor="let session of sessions"
      class="session-item"
      [class.active]="session.id === activeSessionId"
      (click)="onSelectSession(session.id)"
    >
      <div class="session-icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          ></path>
        </svg>
      </div>

      <div class="session-content">
        <div class="session-title">{{ session.title }}</div>
        <div class="session-preview">{{ session.previewMessage }}</div>
      </div>

      <div class="session-meta">
        <div class="session-time">{{ formatDate(session.timestamp) }}</div>

        <button
          class="delete-button"
          (click)="confirmDeleteSession(session.id, $event)"
          aria-label="Delete chat"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>

    <div *ngIf="sessions.length === 0" class="no-sessions">
      <p>No chat history yet</p>
    </div>
  </div>

  <div class="panel-footer">
    <button class="settings-button" (click)="onOpenSettings()">
      <app-settings-button (click)="onOpenSettings()"></app-settings-button>
      <span>Settings</span>
    </button>
  </div>

  <!-- Delete Confirmation Modal -->
  <div *ngIf="showDeleteConfirm" class="delete-modal-backdrop">
    <div class="delete-modal">
      <h3 class="delete-modal-title">Delete Chat</h3>
      <p class="delete-modal-message">
        Are you sure you want to delete this chat? This action cannot be undone.
      </p>

      <div class="delete-modal-actions">
        <button class="cancel-button" (click)="closeDeleteConfirm()">
          Cancel
        </button>
        <button class="confirm-delete-button" (click)="onDeleteSession()">
          Delete
        </button>
      </div>
    </div>
  </div>
</aside>
